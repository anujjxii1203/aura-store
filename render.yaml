services:
  - type: web
    name: aura-store-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: aura-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: aura-store-db
    plan: free
    region: singapore
