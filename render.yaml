services:
  - type: web
    name: aura-store-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: DB_TYPE
        value: sqlite
      - key: DATABASE_URL
        value: ./ecommerce.db
      - key: JWT_SECRET
        generateValue: true
